apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart-order
  namespace: shopkart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkart-order
  template:
    metadata:
      labels:
        app: shopkart-order
    spec:
      containers:
        - name: order
          image: shopkartacr2026.azurecr.io/shopkart-order:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3040
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: ORDER_SERVICE_PORT
              value: "3040"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopkart-auth-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopkart-shared-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_ISSUER
              value: "shopkart-auth-service"
            - name: JWT_AUDIENCE
              value: "shopkart-client"
            - name: AUTH_API_URL
              value: "http://shopkart-auth:3010"
            - name: CART_API_URL
              value: "http://shopkart-cart:3030"
            - name: CATALOG_API_URL
              value: "http://shopkart-catalog:3020"
            - name: NOTIFICATION_API_URL
              value: "http://shopkart-notification:3050"
            - name: NOTIFICATION_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopkart-shared-secrets
                  key: NOTIFICATION_INTERNAL_API_KEY
            - name: FRONTEND_URL
              value: "http://localhost:3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3040
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3040
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart-order
  namespace: shopkart
spec:
  type: ClusterIP
  selector:
    app: shopkart-order
  ports:
    - name: http
      port: 3040
      targetPort: 3040
