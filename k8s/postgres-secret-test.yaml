apiVersion: v1
kind: Pod
metadata:
  name: postgres-secret-test
  namespace: shopkart
spec:
  restartPolicy: Never
  containers:
    - name: postgres-client
      image: postgres:17
      command: ["sleep", "3600"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-password-test
              key: PGPASSWORD